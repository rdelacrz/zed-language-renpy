id = "renpy"
name = "Ren'Py"
description = "Ren'Py language support (syntax + language server)."
version = "0.1.0"
schema_version = 1
authors = ["rdelacrz"]
repository = "https://github.com/rdelacrz/zed-language-renpy"
snippets = ["./snippets/ren'py.json"]

[language_servers.renpy-language-server]
name = "Ren'Py Language Server"
languages = ["Ren'Py"]

[language_servers.renpy-language-server.language_ids]
"Ren'Py" = "renpy"

[grammars.renpy]
repository = "https://github.com/rockettap/renpy-tree-sitter"
rev = "0e9ea0d0dcb8860ea1d5f3ac6356855bf58cc556"
