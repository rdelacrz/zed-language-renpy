# Zed language configuration for Ren'Py (.rpy / .rpym files).
# Defines syntax metadata, bracket pairs, and indentation settings.
name = "Ren'Py"
grammar = "renpy"
path_suffixes = ["rpy", "rpym"]
line_comments = ["# "]
tab_size = 4
hard_tabs = false
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
