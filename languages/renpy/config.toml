name = "Ren'Py"
grammar = "renpy"
path_suffixes = ["rpy", "rpym", "rpymc", "rpyc"]
line_comments = ["#"]
tab_size = 4
hard_tabs = false

# Note: .rpyc and .rpymc files
# in path_suffixes so that Zed can open them (they are valid Ren'Py grammar in terms
# of syntax highlighting), but they should generally be treated as read-only outputs.
# Users should not edit .rpyc/.rpymc directly — they are generated by the Ren'Py engine.